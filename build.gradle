plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.+'
}

version = mod_version
group = mod_group_id
base { archivesName = 'half-a-god' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories { mavenCentral() }

neoForge {
    version = project.neo_version
    runs {
        // game tests on a real server (CI runs: gradle runGametest)
        gametest {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // a real dedicated server that checks the court dimension loads, then stops (CI: gradle runSmoke)
        smoke {
            type = "server"
            systemProperty 'halfagod.smoketest', 'true'
            programArgument '--nogui'
            gameDirectory.set(project.file('run-smoke'))
        }
        // a real game client (under a virtual screen in CI) that walks through the new screens and screenshots them
        shots {
            client()
            systemProperty 'halfagod.clientshots', 'true'
            programArguments.addAll('--width', '1280', '--height', '720', '--username', 'Tester')
            gameDirectory.set(project.file('run-shots'))
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, neo_version: neo_version]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml']) { expand props }
}
