name: Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build the mod
        run: gradle build --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: half-a-god
          path: build/libs/*.jar
      - name: Publish the latest build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Download the .jar below and put it in your mods folder. Built automatically from the newest code."
          prerelease: false
          make_latest: true
          files: build/libs/*.jar
