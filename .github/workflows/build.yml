name: Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build the mod
        shell: bash
        run: |
          set -o pipefail
          gradle build --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          { echo '### Build failed'; echo '```'; grep -E "error:|warning: \[|What went wrong|> |FAILED|Exception|Caused by" build.log | head -150; echo '```'; echo '<details><summary>Last lines</summary>'; echo; echo '```'; tail -n 120 build.log; echo '```'; echo '</details>'; } > report.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@report.md
      - name: Game tests
        id: gametest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout 900 gradle runGametest --no-daemon 2>&1 | tee gametest.log
      - name: Real server (new world, then the same world again)
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p run-smoke && echo "eula=true" > run-smoke/eula.txt
          timeout 600 gradle runSmoke --no-daemon 2>&1 | tee smoke1.log
          timeout 600 gradle runSmoke --no-daemon 2>&1 | tee smoke2.log
          grep -h "HAG-SMOKE" smoke1.log smoke2.log
          grep -q "court=loaded cell=built night=yes" smoke2.log
      - name: Screenshots from a real client
        id: shots
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils > /dev/null
          mkdir -p run-shots/saves
          rm -rf run-shots/saves/shots && cp -r run-smoke/world run-shots/saves/shots
          printf 'onboardAccessibility:false\ntutorialStep:none\njoinedFirstServer:true\nskipMultiplayerWarning:true\npauseOnLostFocus:false\nsoundCategory_master:0.0\nrenderDistance:6\nguiScale:2\nnarrator:0\n' > run-shots/options.txt
          timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" gradle runShots --no-daemon 2>&1 | tee shots.log || true
          ls run-shots/screenshots || true
          grep -E "SHOT|Exception|ERROR" shots.log | grep -v "DEBUG" | head -60 || true
      - name: Screenshots with Sinytra Connector and Mebahel's RPG
        id: shotsmeb
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p run-shots-meb/mods run-shots-meb/saves
          rm -rf run-shots-meb/saves/shots && cp -r run-smoke/world run-shots-meb/saves/shots
          cp run-shots/options.txt run-shots-meb/options.txt
          mr() { curl -sfL "https://api.modrinth.com/v2/project/$1/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D" | jq -r '.[0].files[] | select(.primary) | .url' | head -1; }
          for p in connector forgified-fabric-api; do
            u=$(mr $p); echo "$p: $u"
            [ -n "$u" ] && curl -sfL -o "run-shots-meb/mods/$(basename "$u")" "$u"
          done
          curl -sfL -o run-shots-meb/mods/mebahelrpgrquest-3.4.4-fabric-1.21.1.jar https://cdn.modrinth.com/data/jNqtpcJu/versions/yVzM3N1c/mebahelrpgrquest-3.4.4-fabric-1.21.1.jar
          ls -la run-shots-meb/mods
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" gradle runShotsMeb --no-daemon 2>&1 | tee shotsmeb.log || true
          ls run-shots-meb/screenshots || true
          grep -iE "SHOT|Mebahel|connector|Exception|ERROR" shotsmeb.log | grep -v "DEBUG" | head -80 || true
      - name: Publish the screenshots (branch "shots")
        if: always() && steps.shots.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p /tmp/shots/meb && cp run-shots/screenshots/*.png /tmp/shots/ 2>/dev/null || true
          cp run-shots-meb/screenshots/*.png /tmp/shots/meb/ 2>/dev/null || true
          grep -iE "SHOT|Mebahel|half a god|connector|Exception|ERROR|Caused by|mixin" shotsmeb.log | grep -v DEBUG | head -300 > /tmp/shots/meb/log.txt || true
          tail -n 300 shotsmeb.log > /tmp/shots/meb/tail.txt || true
          grep -E "SHOT|Exception|ERROR|Caused by" shots.log | grep -v DEBUG | head -200 > /tmp/shots/log.txt || true
          tail -n 200 shots.log > /tmp/shots/tail.txt || true
          cd /tmp/shots && git init -q && git checkout -q -b shots && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "screenshots ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shots
      - name: Report game tests
        if: always() && steps.gametest.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          { echo "### Game tests: ${{ steps.gametest.outcome }}, real server: ${{ steps.smoke.outcome }}"; echo '```'; grep -h "HAG-SMOKE\|Exception\|ERROR" smoke1.log smoke2.log 2>/dev/null | head -40; echo '---'; grep -iE "gametest|game test|half_a_god|halfagodtests|required tests|failed|passed|Exception|Caused by|ERROR" gametest.log | grep -v "DEBUG" | head -120; echo '```'; echo '<details><summary>Last lines</summary>'; echo; echo '```'; tail -n 80 gametest.log; echo '```'; echo '</details>'; } > gt.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@gt.md
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: half-a-god
          path: build/libs/*.jar
      - name: Publish the latest build
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Download the .jar below and put it in your mods folder. Built automatically from the newest code."
          prerelease: false
          make_latest: true
          files: build/libs/*.jar
